appId: io.github.seunggulee1007.reviewgate.desktop
productName: ReviewGate
directories:
  output: release
  buildResources: build
asar: true
files:
  - dist/**
  - package.json
  # The SDK's per-platform optional packages carry a ~200 MB native `claude` each. ReviewGate never
  # runs it: the engine always passes `pathToClaudeCodeExecutable` = the user's installed claude
  # (PATH / Settings override; on Windows a `claude.cmd` shim is resolved first — src/main/winClaude.ts)
  # and refuses to start a session when none is found. So no platform binary ships, for any target
  # (a mac-built win installer used to carry claude-agent-sdk-darwin-arm64) — docs/M11-WINDOWS.md.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  # node-pty (terminal chat / shell panel, docs/M11-WINDOWS.md "Terminal"): only lib/ and the prebuilds run; the
  # sources, winpty sources, the duplicate third_party ConPTY copy, build scripts, typings, debug symbols and the
  # compile-time node-addon-api stay out.
  - "!node_modules/node-pty/{src,deps,third_party,scripts,typings}/**"
  - "!node_modules/node-pty/binding.gyp"
  - "!node_modules/node-pty/prebuilds/**/*.pdb"
  - "!node_modules/node-addon-api/**"
# node-pty runs from real files: its .node binaries, the conout worker thread, conpty.dll / OpenConsole.exe and the
# console-list agent cannot load from inside app.asar. main/pty/nodePty.ts requires it from app.asar.unpacked by path.
asarUnpack:
  - "node_modules/node-pty/**"
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
# The engine spawns external `claude` / `gh` / `git` from PATH (or the Settings overrides); nothing is bundled.
win:
  files:
    - "!node_modules/node-pty/prebuilds/{darwin-*,win32-arm64}/**"
  target:
    - target: nsis
      arch: [x64]
  # rcedit (icon / version resource) needs wine on macOS; the installer builds without it.
  signAndEditExecutable: false
# A new installer run over an installed ReviewGate upgrades it in place — no uninstall first (docs/M11-WINDOWS.md
# "Updating", PROTOCOL §48 Windows). What guarantees it, with electron-builder 26's NSIS templates:
# - `appId` above never changes and there is no `nsis.guid`: the GUID derived from it keys the install's registry entry
#   (HKCU\Software\<GUID> InstallLocation, KeepShortcuts), so the new installer finds the old install, installs into the
#   same folder (also one the user picked) and runs the old uninstaller silently with `/currentuser --updated
#   --keep-shortcuts` before copying the new files;
# - `productName` never changes either (the folder %LOCALAPPDATA%\Programs\ReviewGate, the shortcuts, "Uninstall
#   ReviewGate.exe" — the in-app update looks for it);
# - `deleteAppDataOnUninstall: false`: %APPDATA%\ReviewGate (settings.json, logs) is never removed, and `--updated` keeps
#   it even if this ever changed;
# - `perMachine: false`: per user, no elevation. The in-app update runs `/S /currentuser --updated --force-run`
#   (src/main/updateInstall.ts INSTALLER_ARGS): silent, this user's install, and ReviewGate started when it is done.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
mac:
  files:
    - "!node_modules/node-pty/prebuilds/win32-*/**"
  target: dir
  identity: null
# node-pty 1.1.0 is N-API (node-addon-api) with prebuilds for win32 / darwin: Electron loads them without a rebuild.
# No electronFuses that turn off RunAsNode: node-pty's console-list agent fork()s, and the engine's cli.js probe needs it.
npmRebuild: false
